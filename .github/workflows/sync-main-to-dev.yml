# main → dev 자동 동기화 (CLAUDE.md 3.5절)
#
# 왜 필요한가
#   dev → main PR을 "Create a merge commit"으로 합치면 merge 커밋이 main에만 남는다.
#   그대로 두면 두 브랜치의 공통 조상이 2개가 되어, 다음 dev → main PR에서
#   GitHub이 dev에서 바꾼 줄을 전부 충돌로 표시한다 (robot-delivery에서 실제로 겪음).
#
# 무엇을 하나
#   main에 push가 생기면 (= dev → main PR merge) main을 dev에 합쳐 dev에 push한다.
#   - 그 사이 dev에 새 커밋이 없으면: dev가 main 위치로 앞으로 이동만 한다 (fast-forward).
#   - 그 사이 dev에 다른 PR이 합쳐졌으면: merge 커밋을 하나 만든다 (보통 충돌 없음).
#   - 충돌이 나면: 실패로 표시되고 아무것도 push하지 않는다 → 손으로 동기화한다.
#
# 수동 실행: GitHub 저장소 → Actions → "main → dev 동기화" → Run workflow

name: main → dev 동기화

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: dev 받기
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: main을 dev에 합치고 push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "dev에 main이 이미 들어 있음 → 할 일 없음"
            exit 0
          fi

          echo "== main에만 있는 커밋"
          git log --oneline HEAD..origin/main

          if ! git merge --no-edit -m "main → dev 자동 동기화 (CLAUDE.md 3.5절)" origin/main; then
            git merge --abort || true
            echo "::error::main을 dev에 합치다 충돌이 났습니다. CLAUDE.md 3.5절 방법대로 손으로 동기화해 주세요."
            exit 1
          fi

          echo "== 동기화로 dev 내용이 바뀐 파일 (dev→main merge 직후라면 비어 있어야 정상)"
          git diff --stat ORIG_HEAD HEAD

          git push origin HEAD:dev
