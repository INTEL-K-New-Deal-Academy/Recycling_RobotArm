# 로봇팔(arm/) 설정값 — 실측해서 바꿀 값은 모두 여기에 모은다 (CLAUDE.md 4.2)
# 숫자 옆 "TODO: 실기 확인 필요" 는 아직 실제 팔로 확인하지 않은 임시값이다.

# 연결 포트. "fake" = 실물 없이 가상 팔로 실행
# Raspberry Pi 컨테이너는 "/dev/ttyACM0", Windows 는 "COM4" 같은 이름
port: fake            # TODO: 실기 확인 필요

speed:
  normal: 200         # 서보 목표 속도 (틱/초). 200 ≈ 17.6°/s
  slow: 80            # 음료가 든 컵을 옮길 때. 출렁임·넘침 방지  # TODO: 실기 확인 필요
  test: 60            # 처음 시험하는 동작 (--slow 옵션)
  hook: 50            # 고리에 걸고 당기는 동작. 빠르면 뚜껑이 튀거나 음료가 출렁인다  # TODO: 실기 확인 필요

pose_timeout_sec: 10.0   # 자세 하나에 도착할 때까지 기다리는 최대 시간

# 그리퍼 열림 정도 (%). 0 = 완전히 닫힘, 100 = 완전히 열림
# 고무줄을 끼운 상태로 맞춰야 한다 (고무줄 두께만큼 간격이 좁아짐)
gripper:
  open: 90            # 컵에 다가갈 때  # TODO: 실기 확인 필요
  hold: 71            # 컵을 잡고 옮길 때. 2026-11-27 원래 그리퍼 실측: 75%(3438)에서 컵에 닿고 71%(3418)로 잘 잡힘
                      # 잡는 높이가 바뀌면(컵 지름이 달라지면) 다시 잰다. 고리에서 당길 때 빠지지 않는지 확인  # TODO: 실기 확인 필요
  release: 90         # 종이류함에 컵을 놓을 때

# 기다리는 시간 (초)
wait:
  grip_settle_sec: 0.3  # 그리퍼를 열고 닫은 뒤 잠깐 기다림
  lid_drop_sec: 0.5   # 뚜껑이 벗겨진 뒤 플라스틱함으로 다 떨어질 때까지  # TODO: 실기 확인 필요
  pour_sec: 3.0       # 기울인 채로 음료·얼음이 다 빠질 때까지  # TODO: 실기 확인 필요

# 동작 순서에 쓰는 자세 이름. 각 자세는 teach.py 로 실제 팔을 손으로 옮겨 저장한다 (data/poses.json)
# 고리·수거함 위치가 실험으로 바뀌면 자세만 다시 저장하면 된다
poses:
  home: home                    # 대기 자세. Ctrl+C 로 멈출 때도 여기로 돌아간 뒤 토크를 끈다
  approach_cup: approach_cup    # 벨트 위 컵 옆, 그리퍼를 연 채 다가가기 직전
  grip_cup: grip_cup            # 그리퍼가 컵 중간~아래를 감싸는 위치 (위쪽은 고리 자리로 비워 둠)
  lift_cup: lift_cup            # 컵을 벨트에서 들어 올린 위치
  # 뚜껑 제거: 고정된 3D 프린트 고리에 뚜껑 가장자리(스커트)를 걸고, 컵을 내리며 기울여 벗긴다
  hook_ready: hook_ready        # 고리 옆. 고리 끝이 스커트보다 1~2cm 아래, 컵 벽 바로 옆
  hook_engage: hook_engage      # 컵을 살짝 내려 스커트 아래 가장자리가 고리 끝에 얹힌 위치
  hook_pull: hook_pull          # 더 내리면서 고리 반대쪽으로 기울인 위치. 뚜껑이 한쪽부터 벗겨짐
  hook_clear: hook_clear        # 고리에서 떨어진 위치. 뚜껑·빨대가 아래 플라스틱함으로 떨어짐
  pour_ready: pour_ready        # 배수통 바로 위, 컵은 아직 서 있음
  pour_tilt: pour_tilt          # 배수통 위에서 컵을 기울인 자세
  paper_bin: paper_bin          # 종이류함 위
